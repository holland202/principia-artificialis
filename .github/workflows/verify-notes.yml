name: verify-all-notes
on: [push, pull_request]
jobs:
  run-reference-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: method lint (METHOD.md M17; Amendment 3)
        run: python scripts/method_lint.py
      - name: method lint self-test (every planted defect class must be detected)
        run: python scripts/method_lint.py --selftest
      - name: method lint sabotage (a planted duplicate must exit 1, not 0 or 2)
        run: |
          set +e
          python scripts/method_lint.py --sabotage
          rc=$?
          test "$rc" -eq 1
      - name: dashboard status sections match their sources (drift exits 1)
        run: python scripts/make_dashboard.py --check
      - name: dashboard generator tests (planted defects must stop the build)
        run: python -m unittest scripts/test_make_dashboard.py -v
      - name: file graph self-test (planted links and a page whose counts are not drawn must be caught)
        run: python scripts/build_filegraph.py --selftest
      - name: file graph page draws what it counts (the 2026-10-19 page claimed 380 edges and drew 0)
        run: python scripts/build_filegraph.py --verify file-graph.html
      - name: rule inventory covers the pre-amendment sources (needs full history; exit 2 = could not run)
        run: python scripts/method_lint.py --coverage
      - run: pip install numpy scipy matplotlib
      - name: run every note's reference code
        run: |
          set -e
          for f in scripts/note*_reference.py; do
            echo "=== $f ==="
            case "$f" in
              scripts/note060_reference.py) timeout 900 python "$f" --selftest ;;
              scripts/note061_reference.py) timeout 900 python "$f" . ;;
              *) timeout 900 python "$f" ;;
            esac
          done
      - name: EXP015-A exact-rational and adversarial controls
        run: python -m unittest discover -s experiments -p 'test_exp015a_composition.py' -v
      - name: number audit self-test (note062 P1/P5) - must pass; the report below cannot fail the build
        run: python scripts/check_numbers.py --plant
      - name: number audit unit tests (note062 P8)
        run: python -m unittest discover -s scripts -p 'test_check_numbers.py' -v
      - name: number audit (note062) - report only, never fails the build
        run: python scripts/check_numbers.py || true
