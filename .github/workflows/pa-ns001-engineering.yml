name: PA-NS-001 engineering only
on:
  push:
    branches: [research/pa-ns-001-protocol-v0-2]
    paths: [research/pa_ns001/**, .github/workflows/pa-ns001-engineering.yml]
permissions:
  contents: read
jobs:
  analytic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Gate B verdict-contract and existing-artifact checks; no AI calls
        run: python research/pa_ns001/gate_b_checks.py
      - name: Gate B status-only sabotage must exit exactly 1
        shell: bash
        run: |
          set +e
          python -O research/pa_ns001/gate_b_checks.py --sabotage
          rc=$?
          test "$rc" -eq 1
      - name: Pinned local engineering checks; no AI calls
        run: python research/pa_ns001/engineering_gate.py --output "$RUNNER_TEMP/pa-ns001-engineering"
      - name: A sabotaged fixture checker must exit exactly 1
        shell: bash
        run: |
          set +e
          python research/pa_ns001/engineering_gate.py --sabotage --output "$RUNNER_TEMP/pa-ns001-sabotage"
          rc=$?
          test "$rc" -eq 1

      - name: Retain raw regression and mutant output in the job log
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pa-ns001-engineering'
          for name in ('tests_normal.stderr.txt', 'tests_optimized.stderr.txt',
                       'tests_docstrings_removed.stderr.txt', 'mutants/summary.json'):
              print('PA_NS001_LOG_BEGIN', name)
              print((root / name).read_text(), end='')
              print('PA_NS001_LOG_END', name)
          PY

      - name: Verify the scoped Gate B source and pre-repair evidence manifest
        run: python research/pa_ns001/verify_package.py --root . --manifest research/pa_ns001/GATE_B_SOURCE_MANIFEST.json
