name: thermal-checkpoint-v21
on:
  push:
    paths:
      - 'experiments/thermal_evidence_v2.py'
      - 'experiments/thermal_checkpoint_v21.py'
      - 'experiments/test_thermal_checkpoint_v21.py'
      - '.github/workflows/thermal-checkpoint-v21.yml'
  pull_request:
    paths:
      - 'experiments/thermal_evidence_v2.py'
      - 'experiments/thermal_checkpoint_v21.py'
      - 'experiments/test_thermal_checkpoint_v21.py'
      - '.github/workflows/thermal-checkpoint-v21.yml'
permissions:
  contents: read
jobs:
  adversarial-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify checkpoint adversarial controls
        run: python -m unittest discover -s experiments -p 'test_thermal_checkpoint_v21.py' -v
