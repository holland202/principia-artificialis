name: Entry challenge (declare before you run)
description: Optional challenge track. Declare a new challenge test before running it, or disclose completed independent work retrospectively.
title: "entry: <challenge ID> — <one-line claim>"
body:
  - type: markdown
    attributes:
      value: |
        This optional challenge route is described in [RECRUITMENT_PROTOCOL.md](https://github.com/holland202/principia-artificialis/blob/main/RECRUITMENT_PROTOCOL.md). You can instead start any independent research and submit a normal issue/PR with no challenge. For **new challenge work**, declare before running the planned checks; label earlier exploratory work RETROSPECTIVE / NOT PREREGISTERED. This issue is PUBLIC when submitted. A separate written consent is needed only for any additional curated evaluation article. Negative and null results count. Do not post secrets or private data, or test beyond published challenge rules.
  - type: input
    id: challenge
    attributes:
      label: Challenge ID
      description: For example PA-C1, a repository row from the menu, or OPEN; PA-C6 is not yet available.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Repository and pinned commit SHA
      placeholder: "https://github.com/holland202/<repo> @ <full commit SHA>"
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Declared claim
      description: The one thing you will check, stated so that it could turn out wrong.
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: Falsifier
      description: What observed result would show your claim is wrong?
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Planned commands or method
      description: What you intend to run or inspect; for earlier completed work disclose RETROSPECTIVE / NOT PREREGISTERED. Mark SOURCE REVIEW ONLY if no execution is planned.
    validations:
      required: true
  - type: textarea
    id: ai
    attributes:
      label: AI assistance (planned)
      description: Which model(s), for what, and what you will check yourself. Using AI is allowed. Hiding it is disqualifying.
    validations:
      required: true
  - type: checkboxes
    id: agree
    attributes:
      label: Ground rules
      options:
        - label: I will post raw commands, outputs and exit codes, not summaries, and I will report failures and unchecked parts.
          required: true
        - label: I will not test infrastructure, accounts, CI secrets or live services, or go beyond a repository's published challenge rules.
          required: true
        - label: I understand this is unpaid, grants no automatic access, my GitHub issue is public immediately, and any additional curated evaluation record requires separate written consent.
          required: true
